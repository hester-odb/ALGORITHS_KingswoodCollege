<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="micBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#micBg)" />

  <!-- Microscope Base -->
  <rect x="130" y="165" width="140" height="20" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="2" />
  <circle cx="200" cy="165" r="18" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
  <circle cx="200" cy="165" r="6" fill="#38BDF8" opacity="0.8" />

  <!-- Microscope Arm -->
  <path d="M235 165 L235 75 Q235 50 205 50 L190 50" fill="none" stroke="#475569" stroke-width="14" stroke-linecap="round" />

  <!-- Adjustment Knobs -->
  <circle cx="235" cy="110" r="12" fill="#0F172A" stroke="#06B6D4" stroke-width="2" />
  <circle cx="235" cy="110" r="5" fill="#06B6D4" />

  <!-- Stage -->
  <rect x="145" y="125" width="70" height="8" rx="2" fill="#334155" stroke="#64748B" stroke-width="1" />

  <!-- Objective Lens -->
  <rect x="170" y="80" width="20" height="35" rx="4" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <polygon points="170,115 190,115 185,123 175,123" fill="#10B981" />

  <!-- Eyepiece / Digital Camera Head -->
  <rect x="165" y="42" width="30" height="38" rx="6" fill="#0F172A" stroke="#06B6D4" stroke-width="2" />
  <circle cx="180" cy="42" r="7" fill="#38BDF8" />

  <!-- Wifi Wave Icon -->
  <path d="M205 35 Q220 35 220 20" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  <path d="M210 40 Q228 40 228 15" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" />

  <!-- Label text -->
  <rect x="110" y="202" width="180" height="26" rx="13" fill="#083344" stroke="#06B6D4" stroke-width="1.5" />
  <text x="200" y="220" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#BAE6FD" text-anchor="middle" letter-spacing="1">DIGITAL LAB MICROSCOPE</text>
</svg>
