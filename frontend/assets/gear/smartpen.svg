<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="sparkAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#penGrad)" />
  
  <!-- Subtle Grid -->
  <path d="M0 50h400M0 100h400M0 150h400M0 200h400M50 0v260M100 0v260M150 0v260M200 0v260M250 0v260M300 0v260M350 0v260" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />

  <!-- Charging Dock Base -->
  <path d="M70 140 L330 140 L310 170 L90 170 Z" fill="#1E293B" stroke="#059669" stroke-width="2.5" />
  <rect x="110" y="148" width="180" height="5" rx="2.5" fill="#10B981" opacity="0.9" />

  <!-- Pens Standing in Dock -->
  <g transform="translate(110, 40)">
    <!-- Pen 1 -->
    <rect x="0" y="15" width="14" height="85" rx="5" fill="#334155" stroke="#10B981" stroke-width="1.5" />
    <path d="M0 15 L7 0 L14 15 Z" fill="#06B6D4" />
    <circle cx="7" cy="85" r="3" fill="#10B981" />
    
    <!-- Pen 2 -->
    <rect x="25" y="10" width="14" height="90" rx="5" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5" />
    <path d="M25 10 L32 -5 L39 10 Z" fill="#10B981" />
    <circle cx="32" cy="85" r="3" fill="#06B6D4" />

    <!-- Pen 3 (Center Featured) -->
    <rect x="50" y="0" width="16" height="100" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="2" />
    <path d="M50 0 L58 -18 L66 0 Z" fill="#38BDF8" />
    <rect x="53" y="25" width="10" height="2" fill="#10B981" />
    <circle cx="58" cy="85" r="4" fill="#10B981" />

    <!-- Pen 4 -->
    <rect x="75" y="10" width="14" height="90" rx="5" fill="#1E293B" stroke="#06B6D4" stroke-width="1.5" />
    <path d="M75 10 L82 -5 L89 10 Z" fill="#10B981" />
    <circle cx="82" cy="85" r="3" fill="#06B6D4" />

    <!-- Pen 5 -->
    <rect x="100" y="15" width="14" height="85" rx="5" fill="#334155" stroke="#10B981" stroke-width="1.5" />
    <path d="M100 15 L107 0 L114 15 Z" fill="#06B6D4" />
    <circle cx="107" cy="85" r="3" fill="#10B981" />
    
    <!-- Pen 6 -->
    <rect x="125" y="20" width="14" height="80" rx="5" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <path d="M125 20 L132 5 L139 20 Z" fill="#06B6D4" />
    <circle cx="132" cy="85" r="3" fill="#10B981" />

    <!-- Pen 7 -->
    <rect x="150" y="22" width="14" height="78" rx="5" fill="#334155" stroke="#10B981" stroke-width="1.5" />
    <path d="M150 22 L157 7 L164 22 Z" fill="#10B981" />
    <circle cx="157" cy="85" r="3" fill="#10B981" />
  </g>

  <!-- Label text -->
  <rect x="110" y="195" width="180" height="26" rx="13" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="200" y="213" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle" letter-spacing="1">SPARKPEN CHARGING DOCK</text>
</svg>
