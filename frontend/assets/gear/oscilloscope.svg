<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="scopeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#scopeBg)" />

  <!-- Oscilloscope Main Body -->
  <rect x="70" y="45" width="260" height="135" rx="12" fill="#1E293B" stroke="#475569" stroke-width="2.5" />
  
  <!-- CRT / Digital Screen -->
  <rect x="85" y="60" width="145" height="105" rx="6" fill="#042F2E" stroke="#0D9488" stroke-width="2" />
  
  <!-- Waveform grid -->
  <path d="M85 86 h145 M85 112 h145 M85 138 h145 M121 60 v105 M157 60 v105 M193 60 v105" stroke="#115E59" stroke-width="0.75" />

  <!-- Sine and Pulse Waves -->
  <path d="M85 112 Q100 80, 115 112 T145 112 T175 112 T205 112 T230 112" fill="none" stroke="#2DD4BF" stroke-width="2.5" />
  <path d="M85 140 H105 V95 H130 V140 H160 V95 H185 V140 H215 V95 H230" fill="none" stroke="#F59E0B" stroke-width="1.5" />

  <!-- Control Knobs Panel -->
  <g transform="translate(245, 60)">
    <!-- Big Knob 1 -->
    <circle cx="20" cy="20" r="14" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    <line x1="20" y1="20" x2="28" y2="12" stroke="#38BDF8" stroke-width="2" />
    <!-- Big Knob 2 -->
    <circle cx="55" cy="20" r="14" fill="#0F172A" stroke="#10B981" stroke-width="2" />
    <line x1="55" y1="20" x2="63" y2="12" stroke="#10B981" stroke-width="2" />

    <!-- Small Knobs -->
    <circle cx="15" cy="55" r="8" fill="#334155" />
    <circle cx="40" cy="55" r="8" fill="#334155" />
    <circle cx="65" cy="55" r="8" fill="#334155" />

    <!-- Channel BNC Connectors -->
    <circle cx="12" cy="88" r="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="30" cy="88" r="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="48" cy="88" r="6" fill="#0F172A" stroke="#EC4899" stroke-width="1.5" />
    <circle cx="66" cy="88" r="6" fill="#0F172A" stroke="#10B981" stroke-width="1.5" />
  </g>

  <!-- Label text -->
  <rect x="100" y="202" width="200" height="26" rx="13" fill="#042F2E" stroke="#14B8A6" stroke-width="1.5" />
  <text x="200" y="220" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#CCFBF1" text-anchor="middle" letter-spacing="1">RIGOL 4-CH OSCILLOSCOPE</text>
</svg>
