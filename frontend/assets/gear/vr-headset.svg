<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="vrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#vrBg)" />

  <!-- VR Headstrap -->
  <path d="M100 115 C100 50, 300 50, 300 115" fill="none" stroke="#475569" stroke-width="16" stroke-linecap="round" />
  <line x1="200" y1="58" x2="200" y2="90" stroke="#475569" stroke-width="12" stroke-linecap="round" />

  <!-- VR Headset Body -->
  <rect x="110" y="85" width="180" height="75" rx="24" fill="#1E293B" stroke="#64748B" stroke-width="3" />
  
  <!-- Front Visor Glass -->
  <rect x="125" y="95" width="150" height="55" rx="18" fill="url(#visorGrad)" opacity="0.9" />
  
  <!-- Reflection highlight -->
  <path d="M140 102 Q180 112 240 102" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Tracking Cameras -->
  <circle cx="135" cy="140" r="4" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="265" cy="140" r="4" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.5" />
  <circle cx="200" cy="98" r="3" fill="#0F172A" stroke="#FFFFFF" stroke-width="1" />

  <!-- Label text -->
  <rect x="110" y="202" width="180" height="26" rx="13" fill="#1E1B4B" stroke="#8B5CF6" stroke-width="1.5" />
  <text x="200" y="220" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#EDE9FE" text-anchor="middle" letter-spacing="1">VR CLASSROOM HEADSETS</text>
</svg>
