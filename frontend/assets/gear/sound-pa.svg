<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="soundBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#soundBg)" />

  <!-- Speaker Cabinet -->
  <rect x="120" y="45" width="110" height="135" rx="14" fill="#1E293B" stroke="#475569" stroke-width="2.5" />
  
  <!-- Speaker Cone Large -->
  <circle cx="175" cy="130" r="32" fill="#0F172A" stroke="#10B981" stroke-width="2.5" />
  <circle cx="175" cy="130" r="14" fill="#1E293B" stroke="#059669" stroke-width="2" />
  <circle cx="175" cy="130" r="5" fill="#10B981" />

  <!-- Tweeter Cone Small -->
  <circle cx="175" cy="72" r="14" fill="#0F172A" stroke="#06B6D4" stroke-width="2" />
  <circle cx="175" cy="72" r="4" fill="#38BDF8" />

  <!-- Wireless Mic -->
  <g transform="translate(265, 45)">
    <!-- Mic Capsule -->
    <rect x="0" y="0" width="26" height="35" rx="13" fill="#334155" stroke="#38BDF8" stroke-width="2" />
    <line x1="0" y1="12" x2="26" y2="12" stroke="#64748B" stroke-width="1" />
    <line x1="0" y1="22" x2="26" y2="22" stroke="#64748B" stroke-width="1" />
    
    <!-- Mic Handle -->
    <path d="M4 35 L4 110 L22 110 L22 35 Z" fill="#0F172A" stroke="#475569" stroke-width="2" />
    <rect x="8" y="55" width="10" height="18" rx="2" fill="#1E293B" />
    <circle cx="13" cy="64" r="3" fill="#10B981" />
    <rect x="7" y="105" width="12" height="14" rx="2" fill="#334155" />
  </g>

  <!-- Label text -->
  <rect x="110" y="202" width="180" height="26" rx="13" fill="#1E293B" stroke="#10B981" stroke-width="1.5" />
  <text x="200" y="220" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle" letter-spacing="1">SOUNDSPARK PA & MIC</text>
</svg>
