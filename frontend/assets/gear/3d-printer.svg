<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="printBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#printBg)" />

  <!-- 3D Printer Frame -->
  <rect x="120" y="45" width="160" height="135" rx="8" fill="none" stroke="#475569" stroke-width="6" />

  <!-- Heated Bed -->
  <rect x="135" y="145" width="130" height="12" rx="3" fill="#1E293B" stroke="#F59E0B" stroke-width="2" />

  <!-- Printed Object on Bed -->
  <polygon points="190,145 210,145 205,115 195,115" fill="#10B981" />
  <circle cx="200" cy="112" r="5" fill="#06B6D4" />

  <!-- X-Axis Rod & Extruder Head -->
  <line x1="120" y1="100" x2="280" y2="100" stroke="#94A3B8" stroke-width="4" />
  <rect x="185" y="85" width="30" height="25" rx="4" fill="#0F172A" stroke="#10B981" stroke-width="2" />
  <polygon points="195,110 205,110 200,116" fill="#F59E0B" />

  <!-- Filament Spool on Top -->
  <circle cx="150" cy="35" r="14" fill="#0F172A" stroke="#10B981" stroke-width="3" />
  <path d="M150 49 Q150 70 190 85" fill="none" stroke="#10B981" stroke-width="2" />

  <!-- Label text -->
  <rect x="100" y="202" width="200" height="26" rx="13" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="200" y="220" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle" letter-spacing="1">SPARKPRINT 3D PROTOTYPER</text>
</svg>
