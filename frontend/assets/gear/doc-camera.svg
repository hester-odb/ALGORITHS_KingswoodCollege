<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="camBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#camBg)" />

  <!-- Document Camera Base -->
  <rect x="130" y="160" width="140" height="18" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <circle cx="160" cy="169" r="4" fill="#10B981" />
  <circle cx="180" cy="169" r="4" fill="#06B6D4" />
  <circle cx="200" cy="169" r="4" fill="#F59E0B" />

  <!-- Flexible Gooseneck Arm -->
  <path d="M245 160 C245 100, 290 60, 200 55" fill="none" stroke="#475569" stroke-width="10" stroke-linecap="round" />

  <!-- Camera Head -->
  <rect x="150" y="45" width="60" height="26" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="2" />
  
  <!-- Lens and LED ring -->
  <circle cx="170" cy="58" r="9" fill="#0F172A" stroke="#10B981" stroke-width="2" />
  <circle cx="170" cy="58" r="4" fill="#38BDF8" />
  <circle cx="195" cy="58" r="5" fill="#FEF08A" />

  <!-- Projected Sheet of Paper on Desk -->
  <polygon points="120,135 210,135 225,155 105,155" fill="#334155" opacity="0.5" stroke="#64748B" stroke-width="1" />
  <line x1="125" y1="142" x2="195" y2="142" stroke="#94A3B8" stroke-width="1" />
  <line x1="120" y1="148" x2="200" y2="148" stroke="#94A3B8" stroke-width="1" />

  <!-- Label text -->
  <rect x="100" y="202" width="200" height="26" rx="13" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="200" y="220" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle" letter-spacing="1">DOCUSPARK 4K VISUALIZER</text>
</svg>
