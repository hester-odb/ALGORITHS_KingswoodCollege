<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="260" fill="url(#bgGrad)" />
  <circle cx="200" cy="110" r="85" fill="#10B981" opacity="0.08" />
  
  <!-- Subtle Grid -->
  <path d="M0 50h400M0 100h400M0 150h400M0 200h400M50 0v260M100 0v260M150 0v260M200 0v260M250 0v260M300 0v260M350 0v260" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />

  <!-- Projection Beam Glow -->
  <polygon points="255,105 380,50 380,160" fill="url(#lensGrad)" opacity="0.18" filter="url(#glow)" />
  <polygon points="255,105 380,70 380,140" fill="#38BDF8" opacity="0.25" />

  <!-- Projector Body -->
  <rect x="80" y="80" width="180" height="65" rx="14" fill="#1E293B" stroke="#059669" stroke-width="3" />
  <rect x="95" y="92" width="60" height="8" rx="4" fill="#334155" />
  <circle cx="102" cy="115" r="4" fill="#10B981" />
  <circle cx="118" cy="115" r="4" fill="#06B6D4" />
  <circle cx="134" cy="115" r="4" fill="#F59E0B" />

  <!-- Lens Housing -->
  <rect x="225" y="90" width="30" height="45" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="2" />
  <circle cx="240" cy="112" r="16" fill="url(#lensGrad)" />
  <circle cx="240" cy="112" r="9" fill="#E0F2FE" opacity="0.8" />
  <circle cx="236" cy="108" r="3" fill="#FFFFFF" />

  <!-- Projector Stand / Legs -->
  <rect x="100" y="145" width="20" height="8" rx="3" fill="#475569" />
  <rect x="220" y="145" width="20" height="8" rx="3" fill="#475569" />

  <!-- Label text -->
  <rect x="120" y="195" width="160" height="26" rx="13" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="200" y="213" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle" letter-spacing="1">SOLARBEAM PROJECTOR</text>
</svg>
