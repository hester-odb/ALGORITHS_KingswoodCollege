<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="roboBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#roboBg)" />

  <!-- Wheels -->
  <rect x="110" y="125" width="25" height="45" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
  <rect x="265" y="125" width="25" height="45" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />

  <!-- Robot Chassis -->
  <rect x="125" y="105" width="150" height="65" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2.5" />

  <!-- Microcontroller / Brain Board -->
  <rect x="150" y="70" width="100" height="45" rx="8" fill="#047857" stroke="#10B981" stroke-width="2" />
  
  <!-- LED Matrix Display on Robot -->
  <g fill="#A7F3D0" transform="translate(165, 80)">
    <circle cx="5" cy="5" r="2.5" />
    <circle cx="20" cy="5" r="2.5" />
    <circle cx="50" cy="5" r="2.5" />
    <circle cx="65" cy="5" r="2.5" />
    <circle cx="5" cy="20" r="2.5" />
    <circle cx="20" cy="25" r="2.5" />
    <circle cx="35" cy="25" r="2.5" />
    <circle cx="50" cy="25" r="2.5" />
    <circle cx="65" cy="20" r="2.5" />
  </g>

  <!-- Ultrasonic Sensor "Eyes" -->
  <circle cx="170" cy="130" r="14" fill="#0F172A" stroke="#06B6D4" stroke-width="3" />
  <circle cx="170" cy="130" r="6" fill="#38BDF8" />
  <circle cx="230" cy="130" r="14" fill="#0F172A" stroke="#06B6D4" stroke-width="3" />
  <circle cx="230" cy="130" r="6" fill="#38BDF8" />

  <!-- Label text -->
  <rect x="110" y="198" width="180" height="26" rx="13" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="200" y="216" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle" letter-spacing="1">ROBOSPARK CODING KIT</text>
</svg>
